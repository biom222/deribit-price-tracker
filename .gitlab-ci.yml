image: python:3.12-slim

stages:
  - quality
  - test

before_script:
  - pip install --no-cache-dir --upgrade pip
  - pip install --no-cache-dir -e ".[dev]"

ruff:
  stage: quality
  script:
    - ruff check .
    - ruff format --check .

pytest:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: deribit_test
    POSTGRES_USER: deribit_test
    POSTGRES_PASSWORD: ci_test_only
    TEST_DATABASE_URL: postgresql+asyncpg://deribit_test:ci_test_only@postgres:5432/deribit_test
  script:
    - pytest
